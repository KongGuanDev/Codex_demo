                    - text: 详情
                    - generic [ref=e402]: 
                - text: 电子科技大学，简称“成电”（UESTC），坐落于四川省成都市，是中华人民共和国教育部直属的全国重点大学，国家首批“211工程”、“985工程”重点建设大学，首批国家“双一流”建设高校。入选111计划、101计划、强基计划、珠峰计划、英才计划、卓越工程师教育培养计划、国家建设高水平大学公派研究生项目、国家卓越工程师学院建设高校。是一所以电子信息科学技术为核心，以工为主，理工渗透，理、工、管、文、医协调发展的多科性研究型大学，被誉为“中国民族电子工业摇篮”和“中国电子类院校排头兵”。学校前身为1956年9月创办的成都电讯工程学院，是在周恩来总理的亲自部署下，由交通大学的电讯工程系、华南工学院的电讯系和南京工学院的无线电系合并创建而成，是新中国第一所无线电大学；1960年被列为全国重点高等学校；1961年划归国防部国防科学技术委员会管理，被确定为七所国防工业院校之一；1970年划归四机部和解放军总参通信兵部共同管理；1988年更名为电子科技大学；2000年由原信息产业部主管划转为教育部主管；2017年进入国家建设“世界一流大学”A类高校行列。截至2025年9月，学校设有清水河、沙河、九里堤三个校区（总占地面积3700余亩）；设有40余个教学科研单位、研究机构；有一级学科博士学位授权点23个，一级学科硕士学位授权点33个，博士专业学位授权点4个、硕士专业学位授权点13个；教职工3800余人，在读本、硕、博学生44000余人。截至2024年11月，学校有65个本科专业。
