              - generic [ref=f3e337]:
                - generic [ref=f3e340]:
                  - generic [ref=f3e341]:
                    - generic [ref=f3e342]:
                      - generic [ref=f3e343]: 辣条到底是啥东西
                      - text: 
                    - paragraph [ref=f3e354]:
                      - text: 辣条学名叫
                      - mark [ref=f3e355]:
                        - text: ‌
                        - strong [ref=f3e356]: 调味面制品
                        - text: ‌
                      - text: ，用小麦粉或谷物、豆类做原料，经过挤压熟化、调味成型后包装而成 。它不是油炸食品，而是通过高温高压挤压膨化后调味制成的即食零食 。2022年国家出台行业标准QB/T5729-2022，对辣条的感官、理化指标、食品添加剂和微生物限量都做了明确规定 。‌‌
                      - button "参考文档，单指双击即可执行" [ref=f3e1164]:
                        - generic [ref=f3e1165]: 百科
                  - generic [ref=f3e361]:
                    - generic [ref=f3e362]:
                      - generic [ref=f3e363]: 辣条从哪来的
                      - text: 
                    - paragraph [ref=f3e374]:
                      - text: 辣条
                      - mark [ref=f3e375]:
                        - text: ‌
                        - strong [ref=f3e376]: 1998年起源于湖南平江县
                        - text: ‌
                      - text: ，当时因为洪水导致大豆减产，平江三市镇的邱平江、李猛能、钟庆元三位青年改用面粉代替豆粉，在挤压熟化机器上创新发明了麻辣味辣条 。平江人习惯叫它"麻辣"，后来才叫辣条。之后辣条生产分为南北两派，南派集中在湖南平江周边，北派以河南郑州、漯河等地为主，卫龙是北派代表品牌 。‌‌
                      - button "参考文档，单指双击即可执行" [ref=f3e1169]:
                        - generic [ref=f3e1170]: 百科
                      - text: ‌
                      - generic [ref=f3e1174]: 
                  - generic [ref=f3e386]:
                    - generic [ref=f3e387]:
                      - generic [ref=f3e388]: 吃辣条要注意啥
                      - text: 
                    - paragraph [ref=f3e399]:
                      - text: 辣条含有一定碳水化合物和植物蛋白，但
                      - mark [ref=f3e400]:
                        - text: ‌
                        - strong [ref=f3e401]: 油盐和添加剂含量较高
                        - text: ‌
                      - text: ，过量食用可能增加肥胖、高血压风险 。正规辣条生产企业都遵循国家食品安全标准，选择有SC生产许可的产品更安全 。建议每天摄入量控制在50克以内，吃完可以搭配酸奶或水果缓解口腔刺激 。关于"吃辣条导致白血病"的说法没有科学依据，但确实要避免购买三无产品 。‌‌‌
