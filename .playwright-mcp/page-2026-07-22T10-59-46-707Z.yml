                  - text: ‌
                  - strong [ref=f3e332]: 辣条是以小麦粉为主要原料制成的调味面制品
                  - text: ‌
                - text: ，起源于湖南平江，现在已发展成国民级零食，卫龙、麻辣王子等是常见品牌 。‌‌
                - button "参考文档，单指双击即可执行" [ref=f3e1159]:
