                  - generic "辣条是以小麦粉或其他谷物、豆类为主要原料制成的一种辛辣零食，起源于1998年湖南平江县三市镇青年邱平江、李猛能、钟庆元等人因洪水导致大豆减产改用面粉制作的创新产品，结合平江酱干工艺首创麻辣味辣条。辣条含有大量食品添加剂，曾无统一制作标准，执行DB41/T515-2007和GB2760；2022年出台行业标准QB/T5729-2022，规定减盐降脂指标。2019年3月15日，中央广播电视总台3·15晚会曝光河南开封兰考县和湖南平江县企业生产问题，引发整治行动。同年12月10日，国家市场监督管理总局发布公告明确分类标准，禁止使用山梨酸及其钾盐、脱氢乙酸及其钠盐并严格限制甜蜜素使用量。2025年，台湾监察机构称大陆辣条通过免查验渠道进入台湾，国台办发言人回应；同年麻辣王子品牌举办年度粉丝见面会。2026年，麻辣王子和卫龙品牌有辣条产品。2026年05月18日人民日报报道，平江辣条产业产值约200" [ref=f3e869]:
